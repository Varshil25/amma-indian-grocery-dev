services:
  - type: web
    name: amma-grocery-api
    runtime: node
    plan: free
    rootDir: apps/api
    # db push applies additive schema changes; it refuses (and fails the build) rather than drop data
    buildCommand: npm install --include=dev && npx prisma db push --skip-generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://varshil25.github.io
      - key: ADMIN_URL
        value: https://varshil25.github.io
      # Optional — online card payments are offered only when both Stripe keys are set
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Optional — emails are only logged until this is set
      - key: SENDGRID_API_KEY
        sync: false
