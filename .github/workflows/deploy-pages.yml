name: Deploy web & admin to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "apps/admin/**", "packages/**", ".github/**", "package-lock.json"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_API_URL: https://amma-grocery-api.onrender.com/api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=apps/web -- --base=/amma-indian-grocery-dev/
      - run: npm run build --workspace=apps/admin -- --base=/amma-indian-grocery-dev/admin/
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r apps/web/dist/. site/
          mkdir -p site/admin
          cp -r apps/admin/dist/. site/admin/
          cp .github/pages/404.html site/404.html
          rm -f site/_redirects
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
